name: Test shell

on:
  # yamllint disable-line #;< SCHEDULE
  schedule:
    - cron: '23 4 * * *'
  # yamllint disable-line #;> SCHEDULE
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions: {}

env:
  BATS_LIB_PATH: "./node_modules"

jobs:
  test-shell:
    name: Shell, ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04
          - macos-latest
          - macos-15
          # yamllint disable-line #;< WINDOWS
          - windows-latest
          # yamllint disable-line #;> WINDOWS
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
      pull-requests: write # Post the coverage summary as a PR comment.

    steps:
      # yamllint disable-line #;< WINDOWS
      - name: Keep LF line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      # yamllint disable-line #;> WINDOWS
      - name: Install current Bash on macOS
        if: startsWith(matrix.os, 'macos-')
        run: brew install bash

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Setup sh-checker
        uses: luizm/action-sh-checker@883217215b11c1fabbf00eb1a9a041f62d74c744 # v0.10.0
        if: matrix.os == 'ubuntu-latest'
        env:
          SHFMT_OPTS: -i 2 -ci -s -d
        continue-on-error: ${{ vars.CI_LINT_IGNORE_FAILURE == '1' }}
        #;< META
        with:
          sh_checker_exclude: '.scaffold'
        #;> META

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: tests/bats

      - name: Install Kcov
        run: |
          KCOV_VERSION=v43 && \
          sudo apt update && sudo apt install -y binutils-dev build-essential cmake git libcurl4-openssl-dev libdw-dev libiberty-dev libssl-dev python3 zlib1g-dev && \
          git clone https://github.com/SimonKagstrom/kcov.git "${RUNNER_TEMP}/kcov" && \
          cd "${RUNNER_TEMP}/kcov" && git checkout ${KCOV_VERSION} && mkdir build && cd build && \
          cmake .. && make && sudo make install && \
          kcov --version
        if: matrix.os == 'ubuntu-latest'

      - name: Run Tests and Code Coverage on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p "$(pwd)"/.logs/.coverage-html
          kcov_args=('--include-pattern=.sh,.bash' '--bash-parse-files-in-dir=.' '--exclude-pattern=vendor,node_modules,.logs,docs,tests')
          #;< META
          # The template's own scripts are covered by the 'Test Scaffold' workflow.
          kcov_args+=(--exclude-path="$(pwd)/install.sh,$(pwd)/.scaffold")
          #;> META
          kcov "${kcov_args[@]}" "$(pwd)"/.logs/.coverage-html ./tests/bats/node_modules/.bin/bats tests/bats
        shell: bash
        continue-on-error: ${{ vars.CI_TEST_IGNORE_FAILURE == '1' }}

      - name: Generate code coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          jq -r --arg root "${GITHUB_WORKSPACE}/" '
            ["File", "% Lines", "Lines"],
            ["All files", .percent_covered, "\(.covered_lines)/\(.total_lines)"],
            (.files | sort_by(.file)[] | [(.file | ltrimstr($root)), .percent_covered, "\(.covered_lines)/\(.total_lines)"])
            | @tsv
          ' .logs/.coverage-html/bats/coverage.json | column -t -s $'\t' > .logs/coverage.txt
          cat .logs/coverage.txt
          { echo "COVERAGE_CONTENT<<EOF"; cat .logs/coverage.txt; echo "EOF"; } >> "$GITHUB_ENV"
        shell: bash

      - name: Post coverage summary as PR comment
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@70d2764d1a7d5d9560b100cbea0077fc8f633987 # v3
        with:
          header: coverage-shell
          message: |
            **Shell code coverage**

            ```
            ${{ env.COVERAGE_CONTENT }}
            ```
          # Post a new comment every time to keep the coverage history.
          hide_and_recreate: true

      - name: Upload coverage report as an artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{github.job}}-code-coverage-report
          include-hidden-files: true
          path: .logs
          if-no-files-found: error

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: ${{ env.CODECOV_TOKEN != '' && matrix.os == 'ubuntu-latest' }}
        with:
          directory: .logs/.coverage-html
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Run Tests on other OSes
        if: matrix.os != 'ubuntu-latest'
        run: ./tests/bats/node_modules/.bin/bats tests/bats
        shell: bash
        continue-on-error: ${{ vars.CI_TEST_IGNORE_FAILURE == '1' }}
