name: 'Auto Author Assign'

on:
  pull_request_target:
    types:
      - opened
      - reopened

permissions: {}

jobs:
  assign-author:
    name: Assign author
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write # Assign the author to the pull request.

    steps:
      - name: Assign author
        uses: toshimaru/auto-author-assign@415448809ea5ba0e171b251632720b009df3d8d6 # v3.1.1
