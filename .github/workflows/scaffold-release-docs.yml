name: Release Scaffold docs

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# A separate group from 'release-docs.yml', which runs on the same tags, so its
# skipped run does not cancel this one.
concurrency:
  group: scaffold-pages
  cancel-in-progress: true

jobs:
  release-docs:
    name: Release Scaffold documentation
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.base_url }}

    defaults:
      run:
        working-directory: docs

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7

      - name: Install dependencies
        run: npm install
        working-directory: '${{ github.workspace }}/.scaffold/docs'

      - name: Set release version
        working-directory: ${{ github.workspace }}
        env:
          INPUTS_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${INPUTS_VERSION:-${REF_NAME}}"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "Release version: $version"

      # With RELEASE_VERSION set, the build serves the stub that runs the
      # installer of the latest release at '/install.sh'.
      - name: Build documentation site
        run: npm run build
        working-directory: '${{ github.workspace }}/.scaffold/docs'

      - name: Check release stub
        working-directory: ${{ github.workspace }}
        run: cmp .scaffold/docs/build/install.sh .scaffold/installer/install-latest.sh

      # 'scaffold-release-installer.yml' attaches the installer to the release
      # while this workflow runs. Deploying the stub before the latest release
      # holds an installer would break the one-line installer.
      - name: Wait for the latest release installer
        working-directory: ${{ github.workspace }}
        timeout-minutes: 20
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh"
          for attempt in $(seq 1 30); do
            if curl -fsSL "${url}" -o latest-install.sh && grep -q '^SCAFFOLD_VERSION=' latest-install.sh; then
              echo "The latest release installer reports version $(bash latest-install.sh --version)."
              exit 0
            fi
            echo "Attempt ${attempt}: ${url} does not serve an installer yet."
            sleep 30
          done
          echo "::error::${url} does not serve an installer, so the stub is not deployed."
          exit 1

      - name: Setup GitHub pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        id: pages

      - name: Upload documentation site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ".scaffold/docs/build"

      - name: Deploy documentation site
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
