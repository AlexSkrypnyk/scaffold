name: Release Scaffold docs

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        type: string

permissions: {}

# A separate group from 'release-docs.yml', which runs on the same tags, so its
# skipped run does not cancel this one.
concurrency:
  group: scaffold-pages
  cancel-in-progress: true

jobs:
  release-docs:
    name: Release Scaffold documentation
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write # Deploy the site to GitHub Pages.
      id-token: write # Verify the deployment's origin to GitHub Pages.

    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.base_url }}

    defaults:
      run:
        working-directory: docs

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: '${{ github.workspace }}/.scaffold/docs'

      - name: Set release version
        working-directory: ${{ github.workspace }}
        env:
          INPUTS_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${INPUTS_VERSION:-${REF_NAME}}"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "Release version: $version"

      - name: Build documentation site
        run: npm run build
        working-directory: '${{ github.workspace }}/.scaffold/docs'

      # getscaffold.dev serves the installer of the latest release at
      # '/install.sh' and '/init.sh', so the release site carries no copy.
      - name: Check that the site holds no installer
        working-directory: ${{ github.workspace }}
        run: |
          for file in install.sh init.sh; do
            [ ! -e ".scaffold/docs/build/${file}" ] || { echo "::error::The release build holds ${file}."; exit 1; }
          done

      - name: Setup GitHub pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        id: pages

      - name: Upload documentation site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ".scaffold/docs/build"

      - name: Deploy documentation site
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
