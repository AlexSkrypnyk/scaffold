name: Test Node.js

on:
  # yamllint disable-line #;< SCHEDULE
  schedule:
    - cron: '23 4 * * *'
  # yamllint disable-line #;> SCHEDULE
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions: {}

jobs:
  test-nodejs:
    name: Node.js ${{ matrix.node }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
      pull-requests: write # Post the coverage summary as a PR comment.

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # yamllint disable-line #;< WINDOWS
          - windows-latest
          # yamllint disable-line #;> WINDOWS
        node: [20, 22, 24]

    steps:
      # yamllint disable-line #;< WINDOWS
      - name: Keep LF line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      # yamllint disable-line #;> WINDOWS
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}

      # yamllint disable-line #;< WINDOWS
      # 'cmd.exe' does not expand the test file globs in the npm scripts.
      - name: Run npm scripts with Bash on Windows
        if: runner.os == 'Windows'
        run: npm config set script-shell "C:\Program Files\Git\bin\bash.exe"

      # yamllint disable-line #;> WINDOWS
      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Check coding standards
        if: matrix.node == 24 && matrix.os == 'ubuntu-latest'
        run: npm run lint
        continue-on-error: ${{ vars.CI_LINT_IGNORE_FAILURE == '1' }}

      - name: Run tests
        run: npm run test-coverage
        continue-on-error: ${{ vars.CI_TEST_IGNORE_FAILURE == '1' }}

      - name: Check code coverage threshold
        if: matrix.node == 24 && matrix.os == 'ubuntu-latest'
        run: |
          RATE=$(grep -o 'line-rate="[0-9.]*"' .logs/cobertura-coverage.xml | head -1 | tr -cd '0-9.')
          PERCENT=$(awk "BEGIN {printf \"%.2f\", $RATE*100}")
          echo "Coverage: $PERCENT% (threshold: $CI_CODE_COVERAGE_THRESHOLD%)"
          if [[ ${PERCENT//./} -lt $((CI_CODE_COVERAGE_THRESHOLD*100)) ]]; then
            echo "FAIL: coverage too low"
            exit 1
          fi
          npx c8 report --reporter=text > .logs/coverage.txt
          { echo "COVERAGE_CONTENT<<EOF"; sed '/./,$!d' .logs/coverage.txt; echo "EOF"; } >> "$GITHUB_ENV"
        env:
          CI_CODE_COVERAGE_THRESHOLD: ${{ vars.CI_CODE_COVERAGE_THRESHOLD || '80' }}

      # Fork and Dependabot pull requests get a read-only token.
      - name: Post coverage summary as PR comment
        if: matrix.node == 24 && matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        uses: marocchino/sticky-pull-request-comment@70d2764d1a7d5d9560b100cbea0077fc8f633987 # v3
        with:
          header: coverage-nodejs
          message: |
            **Node.js code coverage**

            ```
            ${{ env.COVERAGE_CONTENT }}
            ```
          # Post a new comment every time to keep the coverage history.
          hide_and_recreate: true

      - name: Upload coverage report as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{github.job}}-code-coverage-report-${{ matrix.node }}-${{ matrix.os }}
          path: .logs
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: matrix.node == 24 && matrix.os == 'ubuntu-latest' && env.CODECOV_TOKEN != ''
        with:
          files: .logs/cobertura-coverage.xml
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
