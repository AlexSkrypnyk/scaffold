name: Release PHP

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions: {}

jobs:
  build:
    name: Build PHP release
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Sign the attestation.
      attestations: write # Record the attestation.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The tag becomes part of a 'sed' replacement and of asset names.
      - name: Check release tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Tag '${GITHUB_REF_NAME}' is not a version."; exit 1; }
          git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${DEFAULT_BRANCH}" || { echo "::error::Tag '${GITHUB_REF_NAME}' is not on '${DEFAULT_BRANCH}'."; exit 1; }
          echo "RELEASE_VERSION=${GITHUB_REF_NAME}" >> "${GITHUB_ENV}"
          echo "RELEASE_NAME=${REPOSITORY_NAME}-php-${GITHUB_REF_NAME}" >> "${GITHUB_ENV}"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.4

      - name: Install dependencies
        run: composer install --no-scripts

      # yamllint disable-line #;< PHP_PHAR
      - name: Set PHAR version
        run: |
          sed -i "s/\"yourproject-version\": \"development\"/\"yourproject-version\": \"${RELEASE_VERSION}\"/g" box.json

      - name: Build PHAR
        run: composer build

      - name: Test PHAR
        run: |
          ./dist/php-command.phar --version
          ./dist/php-command.phar list || exit 1

      # yamllint disable-line #;> PHP_PHAR
      - name: Collect release assets
        run: |
          mkdir -p .release
          #;< PHP_PHAR
          cp ./dist/php-command.phar .release/
          #;> PHP_PHAR
          #;< PHP_SCRIPT
          cp php-script .release/
          #;> PHP_SCRIPT

      - name: Generate checksums
        working-directory: .release
        run: sha256sum -- * > "${RELEASE_NAME}.sha256"

      - name: Verify checksums
        working-directory: .release
        run: sha256sum --check "${RELEASE_NAME}.sha256"

      # Private repositories get attestations only on GitHub Enterprise Cloud.
      - name: Attest release assets
        id: attest
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .release/*

      # Scorecard reads provenance from release assets only.
      - name: Add attestation bundle
        if: ${{ !github.event.repository.private }}
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "${BUNDLE_PATH}" ".release/${RELEASE_NAME}.intoto.jsonl"

      - name: Verify attestation
        if: ${{ !github.event.repository.private }}
        working-directory: .release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in *; do
            case "${asset}" in *.intoto.jsonl) continue ;; esac
            gh attestation verify "${asset}" --bundle "${RELEASE_NAME}.intoto.jsonl" --repo "${GITHUB_REPOSITORY}"
          done

      - name: Upload release assets as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-php
          path: .release
          include-hidden-files: true
          if-no-files-found: error

  publish:
    name: Publish PHP release
    needs: build
    runs-on: ubuntu-latest

    # The signing key is a secret of this environment, so its protection rules
    # apply before the job can read the key.
    environment: release

    permissions:
      actions: read # Wait for the 'Draft release notes' runs.
      contents: write # Attach the assets to the release.

    concurrency:
      group: release-php
      cancel-in-progress: false

    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-php
          path: .release

      # keys.openpgp.org publishes an address on a key only after its owner
      # confirms it, so the email lookup returns the key the maintainer
      # confirmed.
      - name: Sign checksums
        env:
          CHECKSUMS: .release/${{ github.event.repository.name }}-php-${{ github.ref_name }}.sha256
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          RELEASE_GPG_KEY_EMAIL: ${{ secrets.RELEASE_GPG_KEY_EMAIL }}
        run: |
          [ -n "${GPG_PRIVATE_KEY}" ] || { echo "::error::The GPG_PRIVATE_KEY secret of the 'release' environment is not set. RELEASING.md shows how to set up release signing."; exit 1; }
          [ -n "${RELEASE_GPG_KEY_EMAIL}" ] || { echo "::error::The RELEASE_GPG_KEY_EMAIL secret of the 'release' environment is not set. RELEASING.md shows how to set up release signing."; exit 1; }

          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import

          secret_keys="$(gpg --batch --with-colons --list-secret-keys)"
          if [ "$(grep -c '^sec:' <<< "${secret_keys}")" != 1 ]; then
            echo '::error::GPG_PRIVATE_KEY must hold exactly 1 key.'
            exit 1
          fi
          fingerprint="$(awk -F: '$1 == "fpr" { print $10; exit }' <<< "${secret_keys}")"

          email_path="$(jq -rn --arg email "${RELEASE_GPG_KEY_EMAIL}" '$email | @uri')"
          if ! curl -fsS --retry 3 -o "${RUNNER_TEMP}/release-key.asc" "https://keys.openpgp.org/vks/v1/by-email/${email_path}"; then
            echo "::error::keys.openpgp.org has no key confirmed for the RELEASE_GPG_KEY_EMAIL address. Upload signing key ${fingerprint} there and confirm the address."
            exit 1
          fi

          published_key="$(gpg --batch --with-colons --show-keys "${RUNNER_TEMP}/release-key.asc")"
          if [ "$(awk -F: '$1 == "fpr" { print $10; exit }' <<< "${published_key}")" != "${fingerprint}" ]; then
            echo "::error::The key confirmed for the RELEASE_GPG_KEY_EMAIL address on keys.openpgp.org is not signing key ${fingerprint}."
            exit 1
          fi

          gpg --batch --yes --dearmor --output "${RUNNER_TEMP}/release-key.gpg" "${RUNNER_TEMP}/release-key.asc"

          if [ -n "${GPG_PASSPHRASE}" ]; then
            echo "${GPG_PASSPHRASE}" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --detach-sign --armor "${CHECKSUMS}"
          else
            gpg --batch --yes --detach-sign --armor "${CHECKSUMS}"
          fi

          # 'gpgv' trusts only the keyserver copy, so a signature by any other
          # key in the runner's keyring fails.
          gpgv --keyring "${RUNNER_TEMP}/release-key.gpg" "${CHECKSUMS}.asc" "${CHECKSUMS}"

      - name: Attach assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Tags can move while the job waits for approval, and the assets must
          # match the commit the tag points to.
          tag_sha="$(gh api "repos/${GH_REPO}/commits/${TAG}" --jq .sha)"
          if [ "${tag_sha}" != "${GITHUB_SHA}" ]; then
            echo "::error::Tag '${TAG}' now points to ${tag_sha}, not to ${GITHUB_SHA}, which the assets were built from."
            exit 1
          fi

          # A running Release Drafter sets its draft's tag back to its own guess.
          for run in $(gh run list --workflow draft-release-notes.yml --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId' 2>/dev/null || true); do
            gh run watch "${run}" > /dev/null || true
          done

          state="$(gh release view "${TAG}" --json isDraft --jq 'if .isDraft then "draft" else "published" end' || echo 'none')"

          # An immutable release takes no assets once published.
          if [ "${state}" = 'published' ]; then
            echo "::error::Release '${TAG}' is already published. Release with a tag push, not with the Publish release button."
            exit 1
          fi

          if [ "${state}" = 'none' ]; then
            # Release Drafter names its draft after the version it guesses,
            # which can differ from the pushed tag. A draft whose tag exists
            # already belongs to another release.
            draft=''
            for candidate in $(gh release list --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName'); do
              if ! gh api "repos/${GH_REPO}/git/ref/tags/${candidate}" > /dev/null 2>&1; then
                draft="${candidate}"
                break
              fi
            done

            if [ -n "${draft}" ]; then
              gh release edit "${draft}" --tag "${TAG}" --title "${TAG}"
              notes="$(gh release view "${TAG}" --json body --jq .body)"
              printf '%s\n' "${notes//...${draft}/...${TAG}}" > "${RUNNER_TEMP}/notes.md"
              gh release edit "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md"
            else
              gh release create "${TAG}" --title "${TAG}" --generate-notes --draft --verify-tag
            fi
          fi

          gh release upload "${TAG}" .release/* --clobber
      # yamllint disable-line #;< !NODEJS

      - name: Publish the release
        #;< META
        # 'Release Scaffold installer' publishes Scaffold's own releases.
        if: github.repository != 'AlexSkrypnyk/scaffold'
        #;> META
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease='false'
          if [[ "${TAG}" == *-* ]]; then
            prerelease='true'
          fi

          # A release for an older version must not take "latest" from a newer one.
          latest='false'
          if [ "${prerelease}" = 'false' ]; then
            if ! tags="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName')"; then
              echo '::error::Could not list the published releases.'
              exit 1
            fi
            # Older releases can carry a 'v' prefix, which sorts after digits,
            # or a tag that isn't a version at all.
            highest="$(printf '%s\n%s\n' "${tags}" "${TAG}" | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
            if [ "${highest}" = "${TAG}" ]; then
              latest='true'
            fi
          fi

          gh release edit "${TAG}" --draft=false --prerelease="${prerelease}" --latest="${latest}" --verify-tag
      # yamllint disable-line #;> !NODEJS
