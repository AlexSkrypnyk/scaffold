name: Release PHP

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions: {}

jobs:
  build:
    name: Build PHP release
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Sign the attestation.
      attestations: write # Record the attestation.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The tag becomes part of a 'sed' replacement and of asset names.
      - name: Check release tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Tag '${GITHUB_REF_NAME}' is not a version."; exit 1; }
          git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${DEFAULT_BRANCH}" || { echo "::error::Tag '${GITHUB_REF_NAME}' is not on '${DEFAULT_BRANCH}'."; exit 1; }
          echo "RELEASE_VERSION=${GITHUB_REF_NAME}" >> "${GITHUB_ENV}"
          echo "RELEASE_NAME=${REPOSITORY_NAME}-php-${GITHUB_REF_NAME}" >> "${GITHUB_ENV}"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.4

      - name: Install dependencies
        run: composer install --no-scripts

      # yamllint disable-line #;< PHP_PHAR
      - name: Set PHAR version
        run: |
          sed -i "s/\"yourproject-version\": \"development\"/\"yourproject-version\": \"${RELEASE_VERSION}\"/g" box.json

      - name: Build PHAR
        run: composer build

      - name: Test PHAR
        run: |
          ./dist/php-command.phar --version
          ./dist/php-command.phar list || exit 1

      # yamllint disable-line #;> PHP_PHAR
      - name: Collect release assets
        run: |
          mkdir -p .release
          #;< PHP_PHAR
          cp ./dist/php-command.phar .release/
          #;> PHP_PHAR
          #;< PHP_SCRIPT
          cp php-script .release/
          #;> PHP_SCRIPT

      - name: Generate checksums
        working-directory: .release
        run: sha256sum -- * > "${RELEASE_NAME}.sha256"

      - name: Attest release assets
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .release/*

      # Scorecard reads provenance from release assets only.
      - name: Add attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "${BUNDLE_PATH}" ".release/${RELEASE_NAME}.intoto.jsonl"

      - name: Verify release assets
        working-directory: .release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check "${RELEASE_NAME}.sha256"
          for asset in *; do
            case "${asset}" in *.intoto.jsonl) continue ;; esac
            gh attestation verify "${asset}" --bundle "${RELEASE_NAME}.intoto.jsonl" --repo "${GITHUB_REPOSITORY}"
          done

      - name: Upload release assets as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-php
          path: .release
          include-hidden-files: true
          if-no-files-found: error

  publish:
    name: Publish PHP release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      actions: read # Wait for the 'Draft release notes' runs.
      contents: write # Attach the assets to the release.

    concurrency:
      group: release-php
      cancel-in-progress: false

    steps:
      - name: Download release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-php
          path: .release

      # Publishing stays with the maintainer, so the release is never published
      # here.
      - name: Attach assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A running Release Drafter sets its draft's tag back to its own guess.
          for run in $(gh run list --workflow draft-release-notes.yml --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId' 2>/dev/null || true); do
            gh run watch "${run}" > /dev/null || true
          done

          if ! gh release view "${TAG}" > /dev/null 2>&1; then
            # Release Drafter names its draft after the version it guesses,
            # which can differ from the pushed tag. A draft whose tag exists
            # already belongs to another release.
            draft=''
            for candidate in $(gh release list --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName'); do
              if ! gh api "repos/${GH_REPO}/git/ref/tags/${candidate}" > /dev/null 2>&1; then
                draft="${candidate}"
                break
              fi
            done

            if [ -n "${draft}" ]; then
              gh release edit "${draft}" --tag "${TAG}" --title "${TAG}"
              notes="$(gh release view "${TAG}" --json body --jq .body)"
              printf '%s\n' "${notes//...${draft}/...${TAG}}" > "${RUNNER_TEMP}/notes.md"
              gh release edit "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md"
            else
              gh release create "${TAG}" --title "${TAG}" --generate-notes --draft --verify-tag
            fi
          fi

          gh release upload "${TAG}" .release/* --clobber
