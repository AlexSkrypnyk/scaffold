name: Test PHP

on:
  # yamllint disable-line #;< SCHEDULE
  schedule:
    - cron: '23 4 * * *'
  # yamllint disable-line #;> SCHEDULE
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions: {}

jobs:
  test-php:
    name: PHP ${{ matrix.php-versions }}, Deps ${{ matrix.deps }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
      pull-requests: write # Post the coverage summary as a PR comment.

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # yamllint disable-line #;< WINDOWS
          - windows-latest
          # yamllint disable-line #;> WINDOWS
        php-versions: ['8.3', '8.4', '8.5']
        deps: ['normal', 'lowest']

    steps:
      # yamllint disable-line #;< WINDOWS
      - name: Keep LF line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      # yamllint disable-line #;> WINDOWS
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ matrix.deps }}-${{ hashFiles('**/composer.lock') }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: pcov
          ini-values: pcov.directory=.

      - name: Install dependencies
        shell: bash
        run: |
          if [[ "${{ matrix.deps }}" == "lowest" ]]; then
            composer update --no-scripts --prefer-lowest --prefer-stable ${{ matrix.php-versions == '8.5' && '--ignore-platform-reqs' || '' }}
          else
            composer install --no-scripts ${{ matrix.php-versions == '8.5' && '--ignore-platform-reqs' || '' }}
          fi

      - name: Validate composer.json
        run: |
          composer --verbose validate
          composer normalize --dry-run

      - name: Check coding standards
        if: matrix.php-versions == '8.4' && matrix.deps == 'normal' && matrix.os == 'ubuntu-latest'
        run: composer lint
        continue-on-error: ${{ vars.CI_LINT_IGNORE_FAILURE == '1' }}

      - name: Run tests
        run: composer test-coverage
        continue-on-error: ${{ vars.CI_TEST_IGNORE_FAILURE == '1' }}

      - name: Check code coverage threshold
        if: matrix.php-versions == '8.4' && matrix.deps == 'normal' && matrix.os == 'ubuntu-latest'
        run: |
          RATE=$(grep -o 'line-rate="[0-9.]*"' .logs/cobertura.xml | head -1 | tr -cd '0-9.')
          PERCENT=$(awk "BEGIN {printf \"%.2f\", $RATE*100}")
          echo "Coverage: $PERCENT% (threshold: $CI_CODE_COVERAGE_THRESHOLD%)"
          if [[ ${PERCENT//./} -lt $((CI_CODE_COVERAGE_THRESHOLD*100)) ]]; then
            echo "FAIL: coverage too low"
            exit 1
          fi
          { echo "COVERAGE_CONTENT<<EOF"; sed '/./,$!d' .logs/coverage.txt; echo "EOF"; } >> "$GITHUB_ENV"
        env:
          CI_CODE_COVERAGE_THRESHOLD: ${{ vars.CI_CODE_COVERAGE_THRESHOLD || '80' }}

      # Fork and Dependabot pull requests get a read-only token.
      - name: Post coverage summary as PR comment
        if: matrix.php-versions == '8.4' && matrix.deps == 'normal' && matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        uses: marocchino/sticky-pull-request-comment@70d2764d1a7d5d9560b100cbea0077fc8f633987 # v3
        with:
          header: coverage-php
          message: |
            **PHP code coverage**

            ```
            ${{ env.COVERAGE_CONTENT }}
            ```
          # Post a new comment every time to keep the coverage history.
          hide_and_recreate: true

      - name: Upload coverage report as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{github.job}}-code-coverage-report-${{ matrix.php-versions }}-${{ matrix.deps }}-${{ matrix.os }}
          path: .logs
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: matrix.php-versions == '8.4' && matrix.deps == 'normal' && matrix.os == 'ubuntu-latest' && env.CODECOV_TOKEN != ''
        with:
          files: .logs/junit.xml
          report_type: test_results
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: matrix.php-versions == '8.4' && matrix.deps == 'normal' && matrix.os == 'ubuntu-latest' && env.CODECOV_TOKEN != ''
        with:
          files: .logs/cobertura.xml
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  # yamllint disable-line #;< PHP_PHAR

  build-php:
    name: Build PHAR
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.4

      - name: Install dependencies
        run: composer install --no-scripts

      - name: Build PHAR
        run: composer build

      - name: Test PHAR
        run: |
          ./dist/php-command.phar --version
          ./dist/php-command.phar list || exit 1
  # yamllint disable-line #;> PHP_PHAR
