name: Release Scaffold installer

# Attaches 'install.sh', 'SHA256SUMS', 'SHA256SUMS.asc' and the attestation
# bundle to the draft release of a pushed version tag, then publishes it.
# getscaffold.dev serves the 'install.sh' of the latest release at '/install.sh'.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions: {}

jobs:
  build:
    name: Build Scaffold installer
    runs-on: ubuntu-latest

    # The signing key is a secret of this environment, so its protection rules
    # apply before the job can read the key.
    environment: release

    permissions:
      contents: read
      id-token: write # Sign the attestation.
      attestations: write # Record the attestation.

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The tag becomes part of a 'sed' replacement and of asset names.
      - name: Check release tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Tag '${GITHUB_REF_NAME}' is not a version."; exit 1; }
          git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${DEFAULT_BRANCH}" || { echo "::error::Tag '${GITHUB_REF_NAME}' is not on '${DEFAULT_BRANCH}'."; exit 1; }
          echo "RELEASE_VERSION=${GITHUB_REF_NAME}" >> "${GITHUB_ENV}"

      - name: Build installer
        run: |
          mkdir -p .release
          cp install.sh .release/install.sh
          grep -q '^SCAFFOLD_VERSION="dev"$' .release/install.sh || { echo "::error::install.sh of ${RELEASE_VERSION} holds no SCAFFOLD_VERSION=\"dev\" line to stamp."; exit 1; }
          sed -i "s/^SCAFFOLD_VERSION=\"dev\"$/SCAFFOLD_VERSION=\"${RELEASE_VERSION}\"/" .release/install.sh
          reported="$(bash .release/install.sh --version)"
          [ "${reported}" = "${RELEASE_VERSION}" ] || { echo "::error::The installer reports version '${reported}', not '${RELEASE_VERSION}'."; exit 1; }

      # Pipes the installer into 'bash' in an empty directory, as the one-line
      # installer does, so it downloads the template of its tag.
      - name: Check installer
        run: |
          mkdir installer-check
          cd installer-check
          bash -s -- --namespace=InstallerCheck --name=installer-check --author="Installer Check" < ../.release/install.sh | tee ../installer-check.log
          grep -q 'Initialization complete.' ../installer-check.log || { echo '::error::The installer did not initialize the project.'; exit 1; }

      - name: Generate checksums
        working-directory: .release
        run: sha256sum install.sh > SHA256SUMS

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          [ -n "${GPG_PRIVATE_KEY}" ] || { echo "::error::The GPG_PRIVATE_KEY secret of the 'release' environment is not set."; exit 1; }
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import

      # GPG_PASSPHRASE is needed only for a key that has a passphrase.
      - name: Sign checksums
        working-directory: .release
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "${GPG_PASSPHRASE}" ]; then
            echo "${GPG_PASSPHRASE}" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --detach-sign --armor SHA256SUMS
          else
            gpg --batch --yes --detach-sign --armor SHA256SUMS
          fi

      # 'gpg --verify' accepts any key in the keyring, so the signature must
      # come from the fingerprint of the published key.
      - name: Verify signature
        run: .scaffold/installer/verify-release.sh .release

      - name: Attest release assets
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            .release/install.sh
            .release/SHA256SUMS

      # Scorecard reads provenance from release assets only.
      - name: Add attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "${BUNDLE_PATH}" ".release/scaffold-installer-${RELEASE_VERSION}.intoto.jsonl"

      - name: Upload release assets as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-installer
          path: .release
          include-hidden-files: true
          if-no-files-found: error

  publish:
    name: Publish Scaffold release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      actions: read # Wait for the other release runs.
      contents: write # Upload the assets and publish the release.

    # Releases share Release Drafter's single draft, so 2 runs must not overlap.
    concurrency:
      group: scaffold-release
      cancel-in-progress: false

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-installer
          path: .release

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          .scaffold/installer/verify-release.sh .release
          for asset in install.sh SHA256SUMS; do
            gh attestation verify ".release/${asset}" --bundle ".release/scaffold-installer-${RELEASE_VERSION}.intoto.jsonl" --repo "${GITHUB_REPOSITORY}"
          done

      # An immutable release takes no assets once published, so on the tag-push
      # path every asset is attached to the draft before it is published.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A running Release Drafter sets its draft's tag back to its own guess.
          for run in $(gh run list --workflow draft-release-notes.yml --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId' 2>/dev/null || true); do
            gh run watch "${run}" > /dev/null || true
          done

          # Prints 'draft', 'published' or 'none'.
          release_state() {
            local state
            if ! state="$(gh release view "${TAG}" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2> "${RUNNER_TEMP}/release-view.log")"; then
              if ! grep -q 'release not found' "${RUNNER_TEMP}/release-view.log"; then
                cat "${RUNNER_TEMP}/release-view.log" >&2
                echo "::error::Could not read release '${TAG}'." >&2
                return 1
              fi
              state='none'
            fi
            echo "${state}"
          }

          state="$(release_state)"

          # A published release comes from an earlier run of this job or from
          # the Publish release button.
          if [ "${state}" = 'published' ]; then
            names="$(gh release view "${TAG}" --json assets --jq '.assets[].name')"
            complete='true'
            for asset in install.sh SHA256SUMS SHA256SUMS.asc "scaffold-installer-${TAG}.intoto.jsonl"; do
              grep -qxF "${asset}" <<< "${names}" || complete='false'
            done

            if [ "${complete}" = 'true' ]; then
              mkdir -p "${RUNNER_TEMP}/published"
              gh release download "${TAG}" --dir "${RUNNER_TEMP}/published" --pattern install.sh
              if cmp -s "${RUNNER_TEMP}/published/install.sh" .release/install.sh; then
                echo "Release '${TAG}' is already published with this installer."
                exit 0
              fi
            fi

            if [ "$(gh api "repos/${GH_REPO}/releases/tags/${TAG}" --jq '.immutable // false')" = 'true' ]; then
              echo "::error::Release '${TAG}' was published with the Publish release button and is immutable, so it takes no installer. Release a new version with a tag push."
              exit 1
            fi
          fi

          # The PHP release of the same tag attaches its assets first, and the
          # release needs them.
          php_run="$(gh run list --workflow release-php.yml --branch "${TAG}" --commit "${GITHUB_SHA}" --event push --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "${php_run}" ]; then
            echo "::error::No 'Release PHP' run found for '${TAG}'."
            exit 1
          fi
          if ! gh run watch "${php_run}" --exit-status > /dev/null; then
            echo "::error::The 'Release PHP' run for '${TAG}' failed, so the release is not published."
            exit 1
          fi

          # 'Release PHP' can retag Release Drafter's draft while this job waits.
          state="$(release_state)"

          # The button already set the release's notes, 'latest' and
          # 'prerelease' flags, so only the assets are added.
          if [ "${state}" = 'published' ]; then
            echo "::warning::Release '${TAG}' was published before its installer was attached. Release with a tag push, not with the Publish release button."
            gh release upload "${TAG}" .release/* --clobber
            exit 0
          fi

          # Release Drafter names its draft after the version it guesses, which
          # can differ from the pushed tag. A draft whose tag exists already
          # belongs to another release.
          draft=''
          if [ "${state}" = 'none' ]; then
            for candidate in $(gh release list --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName'); do
              if ! gh api "repos/${GH_REPO}/git/ref/tags/${candidate}" > /dev/null 2>&1; then
                draft="${candidate}"
                break
              fi
            done
          fi

          if [ -n "${draft}" ]; then
            gh release edit "${draft}" --tag "${TAG}" --title "${TAG}"
          elif [ "${state}" = 'none' ]; then
            gh release create "${TAG}" --title "${TAG}" --generate-notes --draft --verify-tag
          fi

          prerelease='false'
          if [[ "${TAG}" == *-* ]]; then
            prerelease='true'
          fi

          # A release for an older version must not take "latest" from a newer one.
          latest='false'
          if [ "${prerelease}" = 'false' ]; then
            if ! tags="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName')"; then
              echo '::error::Could not list the published releases.'
              exit 1
            fi
            # Older releases can carry a 'v' prefix, which sorts after digits,
            # or a tag that isn't a version at all.
            highest="$(printf '%s\n%s\n' "${tags}" "${TAG}" | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
            if [ "${highest}" = "${TAG}" ]; then
              latest='true'
            fi
          fi

          gh release upload "${TAG}" .release/* --clobber

          notes="$(gh release view "${TAG}" --json body --jq .body)"
          if [ -n "${draft}" ]; then
            notes="${notes//...${draft}/...${TAG}}"
          fi
          printf '%s\n' "${notes}" > "${RUNNER_TEMP}/notes.md"

          gh release edit "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md" --draft=false --prerelease="${prerelease}" --latest="${latest}" --verify-tag

      - name: Verify uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p .uploaded
          gh release download "${RELEASE_VERSION}" --dir .uploaded --pattern install.sh --pattern SHA256SUMS --pattern SHA256SUMS.asc --pattern "scaffold-installer-${RELEASE_VERSION}.intoto.jsonl"
          .scaffold/installer/verify-release.sh .uploaded
          for asset in install.sh SHA256SUMS; do
            gh attestation verify ".uploaded/${asset}" --bundle ".uploaded/scaffold-installer-${RELEASE_VERSION}.intoto.jsonl" --repo "${GITHUB_REPOSITORY}"
          done

      # Each URL must serve the uploaded installer byte for byte.
      - name: Verify latest installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          latest="$(gh release view --json tagName --jq .tagName)"
          if [ "${latest}" != "${RELEASE_VERSION}" ]; then
            echo "Release ${RELEASE_VERSION} is not the latest release (${latest}), so the latest download is not checked."
            exit 0
          fi
          for url in "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh" https://getscaffold.dev/install.sh https://getscaffold.dev/init.sh; do
            curl -fsSL "${url}" -o latest-install.sh
            cmp latest-install.sh .release/install.sh || { echo "::error::${url} does not serve the uploaded installer."; exit 1; }
            echo "${url} serves the uploaded installer."
          done
