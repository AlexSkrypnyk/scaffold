name: Release Scaffold installer

# Attaches 'install.sh', 'SHA256SUMS' and 'SHA256SUMS.asc' to a release, with a
# build attestation for 'install.sh' and 'SHA256SUMS'. getscaffold.dev redirects
# '/install.sh' to the 'install.sh' of the latest release.
#
# A manual run attaches the installer to an existing release again.

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: scaffold-release-installer-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  release-installer:
    name: Release Scaffold installer
    runs-on: ubuntu-latest

    # The signing key is a secret of this environment, so its protection rules
    # apply before the job can read the key.
    environment: release

    permissions:
      contents: write # Upload the release assets.
      id-token: write # Sign the attestations.
      attestations: write # Record the attestations.

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The version becomes part of a 'sed' replacement and of asset URLs, so
      # it is limited to the characters a tag of this repository uses.
      - name: Set release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUTS_VERSION: ${{ inputs.version }}
        run: |
          version="${RELEASE_TAG:-${INPUTS_VERSION}}"
          [[ "${version}" =~ ^[0-9A-Za-z._+-]+$ ]] || { echo "::error::Invalid release version '${version}'."; exit 1; }
          git show-ref --verify --quiet "refs/tags/${version}" || { echo "::error::Version ${version} is not a tag of this repository."; exit 1; }
          echo "RELEASE_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Release version: ${version}"

      # Reads the installer from the tag, so a manual run on the default branch
      # attaches the installer of the release it names. Older tags name the
      # installer 'init.sh'.
      - name: Build installer
        run: |
          mkdir -p .release
          if git cat-file -e "refs/tags/${RELEASE_VERSION}:install.sh" 2>/dev/null; then
            git show "refs/tags/${RELEASE_VERSION}:install.sh" > .release/install.sh
          else
            git show "refs/tags/${RELEASE_VERSION}:init.sh" > .release/install.sh
          fi
          grep -q '^SCAFFOLD_VERSION="dev"$' .release/install.sh || { echo "::error::install.sh of ${RELEASE_VERSION} holds no SCAFFOLD_VERSION=\"dev\" line to stamp."; exit 1; }
          sed -i "s/^SCAFFOLD_VERSION=\"dev\"$/SCAFFOLD_VERSION=\"${RELEASE_VERSION}\"/" .release/install.sh
          reported="$(bash .release/install.sh --version)"
          [ "${reported}" = "${RELEASE_VERSION}" ] || { echo "::error::The installer reports version '${reported}', not '${RELEASE_VERSION}'."; exit 1; }

      # Pipes the installer into 'bash' in an empty directory, as the one-line
      # installer does, so it downloads the template of its release.
      - name: Check installer
        run: |
          mkdir installer-check
          cd installer-check
          bash -s -- --namespace=InstallerCheck --name=installer-check --author="Installer Check" < ../.release/install.sh | tee ../installer-check.log
          grep -q 'Initialization complete.' ../installer-check.log || { echo '::error::The installer did not initialize the project.'; exit 1; }

      - name: Generate checksums
        working-directory: .release
        run: sha256sum install.sh > SHA256SUMS

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          [ -n "${GPG_PRIVATE_KEY}" ] || { echo "::error::The GPG_PRIVATE_KEY secret of the 'release' environment is not set."; exit 1; }
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --import

      # GPG_PASSPHRASE is needed only for a key that has a passphrase.
      - name: Sign checksums
        working-directory: .release
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "${GPG_PASSPHRASE}" ]; then
            echo "${GPG_PASSPHRASE}" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --detach-sign --armor SHA256SUMS
          else
            gpg --batch --yes --detach-sign --armor SHA256SUMS
          fi

      # 'gpg --verify' accepts any key in the keyring, so the signature must
      # come from the fingerprint of the published key.
      - name: Verify signature
        run: .scaffold/installer/verify-release.sh .release

      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            .release/install.sh
            .release/SHA256SUMS

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_VERSION}" .release/install.sh .release/SHA256SUMS .release/SHA256SUMS.asc --clobber

      - name: Verify uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .uploaded
          gh release download "${RELEASE_VERSION}" --dir .uploaded --pattern install.sh --pattern SHA256SUMS --pattern SHA256SUMS.asc
          .scaffold/installer/verify-release.sh .uploaded
          gh attestation verify .uploaded/install.sh --repo "${GITHUB_REPOSITORY}"
          gh attestation verify .uploaded/SHA256SUMS --repo "${GITHUB_REPOSITORY}"

      # Follows the Cloudflare redirect of getscaffold.dev and the GitHub
      # redirect of 'releases/latest' to the uploaded installer.
      - name: Verify latest installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh release view --json tagName --jq .tagName)"
          if [ "${latest}" != "${RELEASE_VERSION}" ]; then
            echo "Release ${RELEASE_VERSION} is not the latest release (${latest}), so the latest download is not checked."
            exit 0
          fi
          for url in "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh" https://getscaffold.dev/install.sh https://getscaffold.dev/init.sh; do
            curl -fsSL "${url}" -o latest-install.sh
            cmp latest-install.sh .release/install.sh || { echo "::error::${url} does not serve the uploaded installer."; exit 1; }
            echo "${url} serves the uploaded installer."
          done
