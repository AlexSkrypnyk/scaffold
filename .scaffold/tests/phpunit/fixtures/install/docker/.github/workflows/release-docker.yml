name: Release Docker

on:
  push:
    tags:
      - '*'

permissions: {}

jobs:
  push-release-to-registry:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Sign the image attestation.
      attestations: write # Record the image attestation.

    steps:
      - name: Checkout code
        uses: actions/checkout@__HASH__ # __VERSION__
        with:
          fetch-depth: 0
          persist-credentials: false

      # The tag becomes the image tag.
      - name: Check release tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v?[0-9]+(\.[0-9]+){1,2}([-+][0-9A-Za-z.-]+)?$ ]] || { echo "::error::Tag '${GITHUB_REF_NAME}' is not a version."; exit 1; }
          git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${DEFAULT_BRANCH}" || { echo "::error::Tag '${GITHUB_REF_NAME}' is not on '${DEFAULT_BRANCH}'."; exit 1; }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@__HASH__ # __VERSION__

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@__HASH__ # __VERSION__

      - name: Log in to Docker Hub
        uses: docker/login-action@__HASH__ # __VERSION__
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@__HASH__ # __VERSION__
        with:
          images: ${{ vars.DOCKER_IMAGE || 'yodashut/force-crystal' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@__HASH__ # __VERSION__
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      - name: Attest Docker image
        uses: actions/attest-build-provenance@__HASH__ # __VERSION__
        with:
          subject-name: index.docker.io/${{ vars.DOCKER_IMAGE || 'yodashut/force-crystal' }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
