name: Sign checksums
description: Sign a checksum file with the release GPG key after checking the key against keys.openpgp.org.

inputs:
  checksums:
    description: Path of the checksum file to sign. The signature is written next to it with an '.asc' suffix.
    required: true
  gpg-private-key:
    description: Armored private signing key. Signing is skipped when it is empty, unless 'required' is 'true'.
    required: false
    default: ''
  gpg-passphrase:
    description: Passphrase of the signing key, for a key that has one.
    required: false
    default: ''
  key-email:
    description: Address that keys.openpgp.org has confirmed for the signing key.
    required: false
    default: ''
  required:
    description: Fail instead of skipping when 'gpg-private-key' is empty.
    required: false
    default: 'false'

outputs:
  signed:
    description: "'true' when the checksum file was signed."
    value: ${{ steps.sign.outputs.signed }}
  fingerprint:
    description: Fingerprint of the signing key.
    value: ${{ steps.sign.outputs.fingerprint }}

runs:
  using: composite
  steps:
    # keys.openpgp.org publishes an address on a key only after the address
    # owner confirms it, and links each address to 1 key, so the email lookup
    # returns the key the maintainer confirmed.
    - name: Sign checksums
      id: sign
      shell: bash
      env:
        CHECKSUMS: ${{ inputs.checksums }}
        GPG_PRIVATE_KEY: ${{ inputs.gpg-private-key }}
        GPG_PASSPHRASE: ${{ inputs.gpg-passphrase }}
        KEY_EMAIL: ${{ inputs.key-email }}
        REQUIRED: ${{ inputs.required }}
      run: |
        if [ -z "${GPG_PRIVATE_KEY}" ]; then
          if [ "${REQUIRED}" = 'true' ]; then
            echo "::error::Set the GPG_PRIVATE_KEY secret in the 'release' environment."
            exit 1
          fi
          echo "::notice::GPG_PRIVATE_KEY is not set, so ${CHECKSUMS} is not signed."
          echo 'signed=false' >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        if [ -z "${KEY_EMAIL}" ]; then
          echo "::error::Set the RELEASE_GPG_KEY_EMAIL secret in the 'release' environment to the address keys.openpgp.org has confirmed for the signing key."
          exit 1
        fi

        [ -f "${CHECKSUMS}" ] || { echo "::error::${CHECKSUMS} does not exist."; exit 1; }

        echo "${GPG_PRIVATE_KEY}" | gpg --batch --import

        secret_keys="$(gpg --batch --with-colons --list-secret-keys)"
        if [ "$(grep -c '^sec:' <<< "${secret_keys}")" != 1 ]; then
          echo '::error::GPG_PRIVATE_KEY must hold exactly 1 key.'
          exit 1
        fi
        fingerprint="$(awk -F: '$1 == "fpr" { print $10; exit }' <<< "${secret_keys}")"

        if ! curl -fsS --retry 3 -o "${RUNNER_TEMP}/release-key.asc" "https://keys.openpgp.org/vks/v1/by-email/${KEY_EMAIL}"; then
          echo "::error::keys.openpgp.org has no key confirmed for the RELEASE_GPG_KEY_EMAIL address. Upload signing key ${fingerprint} there and confirm the address."
          exit 1
        fi

        published_key="$(gpg --batch --with-colons --show-keys "${RUNNER_TEMP}/release-key.asc")"
        if [ "$(awk -F: '$1 == "fpr" { print $10; exit }' <<< "${published_key}")" != "${fingerprint}" ]; then
          echo "::error::The key confirmed for the RELEASE_GPG_KEY_EMAIL address on keys.openpgp.org is not signing key ${fingerprint}."
          exit 1
        fi

        gpg --batch --yes --dearmor --output "${RUNNER_TEMP}/release-key.gpg" "${RUNNER_TEMP}/release-key.asc"

        if [ -n "${GPG_PASSPHRASE}" ]; then
          echo "${GPG_PASSPHRASE}" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --detach-sign --armor "${CHECKSUMS}"
        else
          gpg --batch --yes --detach-sign --armor "${CHECKSUMS}"
        fi

        # 'gpgv' trusts only the keyserver copy, so a signature by any other
        # key in the runner's keyring fails.
        gpgv --keyring "${RUNNER_TEMP}/release-key.gpg" "${CHECKSUMS}.asc" "${CHECKSUMS}"

        echo 'signed=true' >> "${GITHUB_OUTPUT}"
        echo "fingerprint=${fingerprint}" >> "${GITHUB_OUTPUT}"
