name: Test Node.js

on:
  schedule:
    - cron: '23 4 * * *'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions: {}

jobs:
  test-nodejs:
    name: Node.js ${{ matrix.node }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        node: [20, 22, 24]

    steps:

      - name: Checkout code
        uses: actions/checkout@__HASH__ # __VERSION__
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@__HASH__ # __VERSION__
        with:
          node-version: ${{ matrix.node }}


      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Check coding standards
        if: matrix.node == 24 && matrix.os == 'ubuntu-latest'
        run: npm run lint
        continue-on-error: ${{ vars.CI_LINT_IGNORE_FAILURE == '1' }}

      - name: Run tests
        run: npm run test-coverage
        continue-on-error: ${{ vars.CI_TEST_IGNORE_FAILURE == '1' }}

      - name: Check code coverage threshold
        if: matrix.node == 24 && matrix.os == 'ubuntu-latest'
        run: |
          RATE=$(grep -o 'line-rate="[0-9.]*"' .logs/cobertura-coverage.xml | head -1 | tr -cd '0-9.')
          PERCENT=$(awk "BEGIN {printf \"%.2f\", $RATE*100}")
          echo "Coverage: $PERCENT% (threshold: $CI_CODE_COVERAGE_THRESHOLD%)"
          if [[ ${PERCENT//./} -lt $((CI_CODE_COVERAGE_THRESHOLD*100)) ]]; then
            echo "FAIL: coverage too low"
            exit 1
          fi
        env:
          CI_CODE_COVERAGE_THRESHOLD: ${{ vars.CI_CODE_COVERAGE_THRESHOLD || '80' }}

      - name: Upload coverage report as an artifact
        uses: actions/upload-artifact@__HASH__ # __VERSION__
        with:
          name: ${{github.job}}-code-coverage-report-${{ matrix.node }}-${{ matrix.os }}
          path: .logs
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@__HASH__ # __VERSION__
        if: matrix.node == 24 && matrix.os == 'ubuntu-latest' && env.CODECOV_TOKEN != ''
        with:
          files: .logs/cobertura-coverage.xml
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
