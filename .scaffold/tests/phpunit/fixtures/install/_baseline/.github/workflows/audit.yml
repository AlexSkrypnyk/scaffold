name: Audit

on:
  schedule:
    - cron: '37 5 * * 1'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'feature/**'
  branch_protection_rule:

permissions: {}

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    # Most Scorecard checks rate repository settings and history, which a pull
    # request does not change.
    if: ${{ github.event_name != 'pull_request' }}

    permissions:
      actions: read
      checks: read # Read check runs for the SAST check on private repositories.
      contents: read
      id-token: write # Sign the results published to the Scorecard API.
      issues: read # Read issues for the checks on private repositories.
      pull-requests: read # Read pull requests for the checks on private repositories.
      security-events: write # Upload the results to code scanning.

    steps:
      - name: Checkout code
        uses: actions/checkout@__HASH__ # __VERSION__
        with:
          persist-credentials: false

      - name: Audit security practices with OpenSSF Scorecard
        uses: ossf/scorecard-action@__HASH__ # __VERSION__
        with:
          results_file: results.sarif
          results_format: sarif
          # The archive omits 'export-ignore' paths such as '.github'.
          file_mode: git
          # Publishing records the repository in a public transparency log.
          publish_results: ${{ github.event.repository.private != true }}

      - name: Upload the audit results to code scanning
        uses: github/codeql-action/upload-sarif@__HASH__ # __VERSION__
        with:
          sarif_file: results.sarif

  security:
    name: Security
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'branch_protection_rule' }}

    permissions:
      actions: read
      contents: read
      security-events: write # Upload the results to code scanning.

    steps:
      - name: Checkout code
        uses: actions/checkout@__HASH__ # __VERSION__
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@__HASH__ # __VERSION__
        with:
          languages: actions,javascript-typescript
          build-mode: none

      - name: Scan code for vulnerabilities with CodeQL
        uses: github/codeql-action/analyze@__HASH__ # __VERSION__

      # CodeQL has no PHP analyzer.
      - name: Scan PHP code for vulnerabilities with Semgrep
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/src" --workdir /src semgrep/semgrep:__VERSION__ semgrep scan --config p/php --metrics=off --sarif --output semgrep.sarif

      - name: Upload the Semgrep results to code scanning
        uses: github/codeql-action/upload-sarif@__HASH__ # __VERSION__
        with:
          sarif_file: semgrep.sarif
          category: semgrep
